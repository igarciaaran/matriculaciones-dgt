name: Actualizar datos DGT
on:
  schedule: [{cron: "30 7 * * 1-5"}]   # laborables, 07:30 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 update_dgt.py
      - run: |
          git config user.name "dgt-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git diff --staged --quiet || (git commit -m "Datos DGT $(date -u +%F)" && git push)
